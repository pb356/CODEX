name: Publish plant pricing website
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: plant-pricing-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          root = os.environ['SITE_URL'].rstrip('/') + '/'
          checks = [('', 'mode-indoor'), ('workspaces.js?v=20261025-catalog9', 'switchMode'), ('workspace.html?mode=indoor&v=catalog9', 'custom-library'), ('workspace.html?mode=outdoor&v=catalog9', 'preview-totals'), ('app.js?v=20261025-catalog9', 'initPriceLibraryEditor'), ('price-library-editor.js?v=catalog9', 'registerOriginal'), ('workbook-edits.js?v=catalog9', 'editWorkbook'), ('library-files.js?v=catalog9', 'storePriceFile'), ('custom-items.js?v=catalog9', 'lineAmount'), ('pricing.js?v=catalog9', 'roundAveragePrice'), ('original-xlsx.js?v=catalog9', 'amountOverride'), ('excel-preview.js?v=catalog9', 'createExcelPreview'), ('excel-preview.css?v=catalog9', '.excel-picture'), ('vendor/ssf.js', 'SSF'), ('rental.js?v=dual6', 'rentDuration'), ('vendor/pdf.mjs', 'pdfjsVersion')]
          for path, marker in checks:
              for attempt in range(10):
                  try:
                      req = urllib.request.Request(root + path, headers={'User-Agent': 'PlantPricingDeploymentCheck/1.0', 'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(req, timeout=15) as response:
                          body = response.read().decode('utf-8')
                          assert response.status == 200 and marker in body, 'Unexpected website content'
                          if path.startswith('workspace.html'):
                              assert 'id="source-rows"' not in body and 'id="excel-preview"' in body and 'id="library-source"' in body and 'id="library-file-editor"' in body, 'Original preview not updated'
                              assert response.headers.get('X-Frame-Options', '').lower() != 'deny', 'Workspace framing denied'
                              assert "frame-ancestors 'none'" not in response.headers.get('Content-Security-Policy', ''), 'Workspace framing denied'
                          if path == '':
                              assert 'template-manager' not in body, 'Retired template UI still present'
                      print('Verified HTTPS 200:', root + path)
                      break
                  except Exception:
                      if attempt == 9:
                          raise
                      time.sleep(5)
          PY
